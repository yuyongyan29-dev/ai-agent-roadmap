site_name: AI Agent 学习路线
site_description: 零代码基础到生产级 Agent 工程师，37 周、65 个单元、每一步都有验收标准
site_url: https://yuyongyan29-dev.github.io/ai-agent-roadmap/
repo_url: https://github.com/yuyongyan29-dev/ai-agent-roadmap
repo_name: ai-agent-roadmap
edit_uri: edit/main/
docs_dir: _site_src
copyright: 文档 CC BY 4.0 · 代码 MIT

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换到深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换到浅色

plugins:
  - search:
      lang: zh

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details

nav:
  - 总览: index.md
  - 开始: docs/开始.md
  - 项目结构: docs/项目结构.md
  - 周计划: docs/周计划.md
